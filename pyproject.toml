[project]
name = "budgetflow"
version = "0.1.0"
description = "A tool to help manage personal financial flows. AI is used to help the user."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "maxapi-python>=2.4.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pydub>=0.25.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "speechrecognition>=3.17.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["speech_recognition", "speech_recognition.*", "pydub", "pydub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymax", "pymax.*"]
follow_imports = "skip"

[tool.ruff.lint.per-file-ignores]
"storage/alembic/versions/c351ef005e00_initial_schema.py" = [
    "I001",
    "UP007",
    "UP035",
]
